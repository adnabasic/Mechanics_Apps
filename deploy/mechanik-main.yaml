apiVersion: apps/v1
kind: Deployment
metadata:
  name: mechanik-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mechanik-main
  template:
    metadata:
      labels:
        app: mechanik-main
    spec:
      containers:
        - name: bokeh
          image: ghcr.io/adnabasic/mechanics-apps:latest
          imagePullPolicy: Always
          env:
            - name: APPLIST
              value: appnames.conf
            - name: PUBLIC_HOST
              value: mechanik-main-project-apps.apps.datalab.unicloud.at
          ports:
            - containerPort: 5006
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mechanik-main
spec:
  selector:
    app: mechanik-main
  ports:
    - port: 5006
      targetPort: 5006
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mechanik-main
  annotations:
    haproxy.router.openshift.io/timeout: 1h
spec:
  host: mechanik-main-project-apps.apps.datalab.unicloud.at
  to:
    kind: Service
    name: mechanik-main
  port:
    targetPort: 5006
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
